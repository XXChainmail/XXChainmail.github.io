<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XX Chainmail Chain Builder</title>
    <script type="module" crossorigin src="/apps/assets/chainbuilder.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/assets/chainbuilder.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        function notifyParent() {
          if (window.parent && window.parent !== window && typeof window.parent.postMessage === 'function') {
            window.parent.postMessage({ type: 'chainbuilder-url', search: window.location.search }, window.location.origin);
          }
        }

        var originalPushState = history.pushState;
        var originalReplaceState = history.replaceState;

        history.pushState = function(state, title, url) {
          var result = originalPushState.apply(this, arguments);
          notifyParent();
          return result;
        };

        history.replaceState = function(state, title, url) {
          var result = originalReplaceState.apply(this, arguments);
          notifyParent();
          return result;
        };

        window.addEventListener('popstate', notifyParent);
        window.addEventListener('DOMContentLoaded', notifyParent);
        notifyParent();
      })();
    </script>
  </body>
</html>
